[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "toolbill"
version = "0.1.3"
description = "Measure the token cost of MCP server tool definitions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "toolbill contributors" }]
keywords = ["mcp", "tokens", "context-window", "model-context-protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mcp>=2.0.0",
  "tiktoken>=0.8.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/Radmo3/toolbill"
Repository = "https://github.com/Radmo3/toolbill"
Issues = "https://github.com/Radmo3/toolbill/issues"
Changelog = "https://github.com/Radmo3/toolbill/blob/main/CHANGELOG.md"

[project.scripts]
toolbill = "toolbill.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/toolbill"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
